name: Mirror to deploy account

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Remove workflow files before mirroring
        run: rm -rf .github/workflows

      - name: Commit and push to deploy account repo
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -m "Mirror update"
          git remote add deploy https://${{ secrets.DEPLOY_PAT }}@github.com/Aabid523/ATS_CHECKER.git
          git push deploy HEAD:main --force
