name: Mirror to deploy account

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to deploy account repo
        run: |
          git remote add deploy https://${{ secrets.DEPLOY_PAT }}@github.com/DEPLOY_USERNAME/ATS.git
          git push deploy main --force
